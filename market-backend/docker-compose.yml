# Rotación de logs: el driver json-file de Docker no rota por defecto — sin
# esto, stdout de cada contenedor puede crecer sin límite y llenar el disco
# del servidor con el tiempo. Aplicado a todos los servicios vía ancla YAML.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Solo accesible desde la propia VM (curl de verificación, health
      # check) — el tráfico público entra por Caddy (80/443), nunca directo
      # a este puerto. Ver el servicio "caddy" abajo.
      - "127.0.0.1:8080:8080"
    environment:
      # Fase 1 (docs/plan-mejoras.md): este es el deploy productivo del repo —
      # application-prod.yml exige explícitamente cada variable de abajo (sin
      # default) y ProdSafetyGuard rechaza el arranque si SEED_ENABLED=true o si
      # alguna llave JWT apunta a un certificado "dev-*".
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Par de llaves propio de este ambiente — nunca el de dev
      # (local-dev/certs, ni siquiera empacado en el jar). Ver deploy/certs/README.md.
      JWT_PRIVATE_KEY_LOCATION: file:/certs/prod-private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/certs/prod-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-market-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-market-clients}
      # Sin esto, el default de application.yml (./data/productos-imagenes,
      # relativo a WORKDIR /app) no coincide con el volumen nombrado montado
      # abajo en /data/productos-imagenes — subir la imagen de un producto
      # fallaba con AccessDeniedException: /app/data (esa ruta nunca se creó
      # ni se le dio dueño en el Dockerfile, a diferencia de /data/productos-imagenes).
      PRODUCTOS_IMAGENES_DIR: /data/productos-imagenes
      # Un solo dominio público, ruteado por path vía Caddy (ver Caddyfile) —
      # el origin que el navegador manda es siempre https://${DOMAIN}, sin
      # importar si pidió "/" (backoffice) o "/api/..." (este backend).
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Guatemala}
    volumes:
      - ./deploy/certs:/certs:ro
      # Volumen nombrado (no bind mount) a propósito: Docker inicializa su
      # contenido/dueño desde lo que ya existía en esa ruta de la imagen
      # (ver Dockerfile) — evita el permission denied que sí tuvo /certs.
      - productos_imagenes:/data/productos-imagenes

  backoffice:
    build:
      context: ../market-backoffice
      args:
        # Vite empaca esto en el bundle en build-time. Un solo dominio
        # ruteado por path (ver Caddyfile): el backend cuelga de
        # https://${DOMAIN}/api/..., así que la base URL del cliente HTTP es
        # el dominio a secas — cada endpoint ya trae su propio "/api/v1/..."
        # (ver market-backoffice/src/config/endpoints.ts). Nunca "backend",
        # el nombre del servicio solo resuelve dentro de la red de compose.
        VITE_API_BASE_URL: https://${DOMAIN}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      # Solo accesible desde la propia VM — el tráfico público entra por
      # Caddy (80/443). Ver el servicio "caddy" abajo.
      - "127.0.0.1:8081:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
      - backoffice
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    build: ./deploy/backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      # Bind mount a una carpeta del host (no un volumen con nombre) a
      # propósito: el respaldo debe sobrevivir aunque se borre el volumen
      # pgdata (ej. "docker compose down -v" por error), no depender de la
      # misma capa de almacenamiento que intenta proteger.
      - ./deploy/backups:/backups

volumes:
  pgdata:
  # Certificados TLS de Let's Encrypt + estado del ACME de Caddy — deben
  # sobrevivir a "docker compose up --build" para no re-solicitar
  # certificados nuevos innecesariamente (Let's Encrypt tiene límite de
  # tasa por dominio).
  caddy_data:
  caddy_config:
  productos_imagenes:
