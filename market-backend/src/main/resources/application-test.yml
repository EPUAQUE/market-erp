# Perfil usado por las pruebas de integración (@SpringBootTest, ej. LiquibaseMigrationIT).
# spring.datasource.* normalmente lo sobreescribe Testcontainers vía @ServiceConnection
# — el default de abajo solo importa si una prueba arranca el contexto sin contenedor.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market_test}
    username: ${DB_USERNAME:market}
    password: ${DB_PASSWORD:market}

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:market-backend-test}
      audience: ${JWT_AUDIENCE:market-clients-test}
      access-token-ttl: ${JWT_ACCESS_TTL:PT10M}
      clock-skew: ${JWT_CLOCK_SKEW:PT30S}
      active-kid: test-2026-01
      keys:
        - kid: test-2026-01
          # Solo en src/test/resources — nunca en el classpath principal ni en el jar.
          private-key-location: classpath:certs/test-private.pem
          public-key-location: classpath:certs/test-public.pem
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin1234!Seguro}
