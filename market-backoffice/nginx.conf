server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # vue-router usa createWebHistory() (sin hash) — cualquier ruta que no
    # sea un archivo real debe caer en index.html para que el router del
    # lado del cliente la resuelva, si no Nginx devuelve 404 en un refresh
    # o link directo a, por ejemplo, /clientes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (los que genera Vite) pueden cachearse
    # agresivo — un deploy nuevo genera nombres de archivo distintos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
