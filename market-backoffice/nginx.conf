server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Defensa en profundidad: Caddy (deploy/Caddyfile) ya pone estas mismas
    # cabeceras de cara a internet; se repiten aquí por si este contenedor
    # se accede directo (red interna, debug) sin pasar por el proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # vue-router usa createWebHistory() (sin hash) — cualquier ruta que no
    # sea un archivo real debe caer en index.html para que el router del
    # lado del cliente la resuelva, si no Nginx devuelve 404 en un refresh
    # o link directo a, por ejemplo, /clientes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (los que genera Vite) pueden cachearse
    # agresivo — un deploy nuevo genera nombres de archivo distintos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
